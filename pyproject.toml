[project]
name = "psd-web-converter"
version = "0.1.0"
description = "Local Photoshop-based PSD to HTML prototype converter."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
psd2web = "psd_web_converter.cli:main"
psd2web-ui = "psd_web_converter.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
